# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/onomazo/main/onomazo.schema.json
---
version: 1

connections:
  microsoft:
    type: microsoft_graph
    tenant_id: ${MICROSOFT_TENANT_ID}
    client_id: ${MICROSOFT_CLIENT_ID}
    client_secret: ${MICROSOFT_CLIENT_SECRET}
  jamf:
    type: jamf
    url: ${JAMF_URL}
    client_id: ${JAMF_CLIENT_ID}
    client_secret: ${JAMF_CLIENT_SECRET}

devices:
  - name: intune
    type: intune
    connection: microsoft
    platforms: [macos, ios, windows]
  - name: jamf
    type: jamf
    connection: jamf
    platforms: [macos, ios]

identity:
  name: entra
  type: entra
  connection: microsoft
  groups:
    staff:
      - ${ENTRA_STAFF_GROUP_ID}
    students:
      - ${ENTRA_STUDENTS_GROUP_ID}

naming:
  constraints:
    max_length: 15
    pattern: "^[A-Z0-9][A-Z0-9-]*$"

  overrides:
    - name: leave-example-device-alone
      when: 'device.serial_number == "EXAMPLE-SERIAL"'
      exclude: true

  variables:
    role:
      cases:
        - when: '"students" in user.groups'
          value: STU
        - when: '"staff" in user.groups'
          value: EMP

  rules:
    - name: assigned-user
      when: |
        user.present &&
        "role" in vars &&
        user.mail_nickname != ""
      desired_name: |
        (vars["role"] + "-" + slug(user.mail_nickname)).upperAscii()

  collisions:
    rank:
      - expression: |
          device.platform == "macos" ? 0 :
          device.platform == "ios" ? 1 :
          device.platform == "windows" ? 2 :
          99
        order: ascending
      - expression: device.enrolled_at
        order: ascending
    disambiguate:
      type: sequence
      separator: "-"
      preserve_existing: true
